<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>

    <link href="{{ "css/clean.css" | absURL }}" rel="stylesheet" type="text/css">
    {{ with resources.Get "css/custom.css" }}
    {{ $css := . | fingerprint }}
    <link href="{{ $css.RelPermalink }}" rel="stylesheet" type="text/css">
    {{ end }}
    <link href="{{ "img/fav.png" | absURL }}" rel="shortcut icon" type="image/png">
    <link href="{{ "img/fav.png" | absURL }}" rel="icon" type="image/png">
    <link href="{{ .Permalink }}" rel="canonical">

</head>
<body>
<div class="page-wrapper">

    {{ partial "navbar.html" . }}
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}

</div>
<!-- Toast Element -->
<div id="toast" class="toast">Coming soon...</div>

<script src="{{ "js/main.js" | absURL }}" type="application/javascript"></script>

</body>
</html>
